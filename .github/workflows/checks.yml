name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/telemetry.test.cjs
      - run: node --check frontend/app.js
      - run: python scripts/package_lambda.py --config backend/endpoints.example.json
      - run: python tests/cloud_smoke.py
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.13.5'
      - run: python scripts/package_lambda.py --config backend/endpoints.example.json
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform test
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: |
            work/browser-report/
            work/browser-results/
          retention-days: 14
